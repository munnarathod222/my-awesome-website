const observer = new MutationObserver((mutations) => {
	for (const mutation of mutations) {
		for (const addedNode of mutation.addedNodes) {
			if (
				addedNode.nodeType === Node.ELEMENT_NODE &&
				(
					addedNode.tagName?.toLowerCase() === 'vite-error-overlay' ||
					addedNode.classList?.contains('backdrop')
				)
			) {
				handleViteOverlay(addedNode);
			}
		}
	}
});

observer.observe(document.documentElement, {
	childList: true,
	subtree: true
});

function handleViteOverlay(node) {
	if (!node.shadowRoot) {
		return;
	}

	const backdrop = node.shadowRoot.querySelector('.backdrop');

	if (backdrop) {
		const overlayHtml = backdrop.outerHTML;
		const parser = new DOMParser();
		const doc = parser.parseFromString(overlayHtml, 'text/html');
		const messageBodyElement = doc.querySelector('.message-body');
		const fileElement = doc.querySelector('.file');
		const messageText = messageBodyElement ? messageBodyElement.textContent.trim() : '';
		const fileText = fileElement ? fileElement.textContent.trim() : '';
		const error = messageText + (fileText ? ' File:' + fileText : '');

		window.parent.postMessage({
			type: 'horizons-vite-error',
			error,
		}, '*');
	}
}

const originalConsoleError = console.error;
const MATCH_LINE_COL_REGEX = /:(\d+):(\d+)\)?\s*$/; // regex to match the :lineNum:colNum
const MATCH_AT_REGEX = /^\s*at\s+(?:async\s+)?(?:.*?\s+)?\(?/; // regex to remove the 'at' keyword and any 'async' or function name
const MATCH_PATH_REGEX = /^\//; // regex to remove the leading slash

function parseStackFrameLine(line) {
	const lineColMatch = line.match(MATCH_LINE_COL_REGEX);
	if (!lineColMatch) return null;
	const [, lineNum, colNum] = lineColMatch;
	const suffix = `:${lineNum}:${colNum}`;
	const idx = line.lastIndexOf(suffix);
	if (idx === -1) return null;
	const before = line.substring(0, idx);
	const path = before.replace(MATCH_AT_REGEX, '').trim();
	
	if (!path) return null;

	try {
		const pathname = new URL(path).pathname;
		const filePath = pathname.replace(MATCH_PATH_REGEX, '') || pathname;
		return `${filePath}:${lineNum}:${colNum}`;
	} catch (e) {
		const filePath = path.replace(MATCH_PATH_REGEX, '') || path;
		return `${filePath}:${lineNum}:${colNum}`;
	}
}

function getFilePathFromStack(stack, skipFrames = 0) {
	if (!stack || typeof stack !== 'string') return null;
	const lines = stack.split('\n').slice(1);

	const frames = lines.map(line => parseStackFrameLine(line.replace(/\r$/, ''))).filter(Boolean);

	return frames[skipFrames] ?? null;
}

console.error = function(...args) {
	originalConsoleError.apply(console, args);

	let errorString = '';
	let filePath = null;

	for (let i = 0; i < args.length; i++) {
		const arg = args[i];
		if (arg instanceof Error) {
			filePath = getFilePathFromStack(arg.stack, 0);
			errorString = `${arg.name}: ${arg.message}`;
			if (filePath) {
				errorString = `${errorString} at ${filePath}`;
			}
			break;
		}
	}

	if (!errorString) {
		errorString = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : String(arg)).join(' ');
		const stack = new Error().stack;
		filePath = getFilePathFromStack(stack, 1);
		if (filePath) {
			errorString = `${errorString} at ${filePath}`;
		}
	}

	window.parent.postMessage({
		type: 'horizons-console-error',
		error: errorString
	}, '*');
};
</script>

const originalFetch = window.fetch;

window.fetch = function(...args) {
	const url = args[0] instanceof Request ? args[0].url : args[0];

	// Skip WebSocket URLs
	if (url.startsWith('ws:') || url.startsWith('wss:')) {
		return originalFetch.apply(this, args);
	}

	return originalFetch.apply(this, args)
		.then(async response => {
			const contentType = response.headers.get('Content-Type') || '';

			// Exclude HTML document responses
			const isDocumentResponse =
				contentType.includes('text/html') ||
				contentType.includes('application/xhtml+xml');

			if (!response.ok && !isDocumentResponse) {
					const responseClone = response.clone();
					const errorFromRes = await responseClone.text();
					const requestUrl = response.url;
					console.error(`Fetch error from ${requestUrl}: ${errorFromRes}`);
			}

			// 🛡️ Live Enterprise Audit Mutation Interceptor
			if (response.ok) {
				try {
					const method = (args[1]?.method || (args[0] instanceof Request ? args[0].method : 'GET')).toUpperCase();
					if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
						const urlStr = String(url);
						if (!urlStr.includes('/api/audit') && !urlStr.match(/\.(css|js|html|png|jpg|jpeg|svg|ico|pdf)($|\?)/i)) {
							let module = 'FLEET';
							let entityType = 'RECORD';
							let entityId = 'N/A';
							const m = urlStr.match(/\/collections\/([^\/]+)(?:\/records(?:\/([^\/?]+))?)?/);
							if (m) {
								const coll = m[1];
								entityId = m[2] || 'new';
								if (['trip_logs', 'trips', 'lorry_receipts', 'pods', 'contracts'].includes(coll)) {
									module = 'LOGISTICS';
									entityType = 'TRIP';
								} else if (['expenses', 'cashbook', 'payments', 'payment_requests', 'salaries', 'advances'].includes(coll)) {
									module = 'FINANCE';
									entityType = 'EXPENSE';
								} else if (['trucks', 'vehicles', 'maintenance_problems', 'tyres', 'job_cards'].includes(coll)) {
									module = 'FLEET';
									entityType = 'TRUCK';
								} else if (['truck_documents', 'documents', 'vault_files'].includes(coll)) {
									module = 'DOCUMENTS';
									entityType = 'DOCUMENT';
								} else if (['users', '_superusers', 'drivers'].includes(coll)) {
									module = 'AUTH';
									entityType = 'USER';
								} else {
									entityType = coll.toUpperCase();
								}
							} else if (urlStr.includes('/api/productivity/tasks')) {
								module = 'PRODUCTIVITY';
								entityType = 'TASK';
							} else if (urlStr.includes('/api/productivity/reminders')) {
								module = 'PRODUCTIVITY';
								entityType = 'REMINDER';
							} else if (urlStr.includes('/api/productivity/workflows')) {
								module = 'PRODUCTIVITY';
								entityType = 'WORKFLOW';
							} else if (urlStr.includes('/api/quotation/rates')) {
								module = 'LOGISTICS';
								entityType = 'RATE_MATRIX';
							}

							let action = 'UPDATE';
							if (method === 'POST') action = 'CREATE';
							else if (method === 'DELETE') action = 'DELETE';

							let actor = {
								id: 'usr_vinod_admin',
								name: 'Vinod Kumar Rathod',
								email: 'munnarathod222@gmail.com',
								role: 'superuser',
								tenant_id: 'JBC_MAIN'
							};

							try {
								const rawAuth = localStorage.getItem('pocketbase_auth');
								if (rawAuth) {
									const parsedAuth = JSON.parse(rawAuth);
									if (parsedAuth.model) {
										actor.id = parsedAuth.model.id || actor.id;
										actor.name = parsedAuth.model.name || parsedAuth.model.full_name || actor.name;
										actor.email = parsedAuth.model.email || actor.email;
										actor.role = parsedAuth.model.role || actor.role;
									}
								} else {
									const rawUser = localStorage.getItem('jbc_user') || localStorage.getItem('jc_current_user');
									if (rawUser) {
										const u = JSON.parse(rawUser);
										actor.id = u.id || actor.id;
										actor.name = u.name || u.full_name || actor.name;
										actor.email = u.email || actor.email;
										actor.role = u.role || actor.role;
									}
								}
							} catch (e) {}

							let newValues = null;
							try {
								if (args[1]?.body && typeof args[1].body === 'string') {
									newValues = JSON.parse(args[1].body);
								}
							} catch (e) {}

							originalFetch.call(window, '/api/audit/event', {
								method: 'POST',
								headers: {
									'Content-Type': 'application/json',
									'X-Actor-Id': actor.id,
									'X-Actor-Role': actor.role
								},
								body: JSON.stringify({
									module,
									entity_type: entityType,
									entity_id: entityId,
									action,
									outcome: 'SUCCESS',
									severity: action === 'DELETE' ? 'HIGH' : 'INFO',
									details: `${action} operation on ${entityType} (${entityId})`,
									actor,
									new_values: newValues
								})
							}).then(r => r.json()).then(data => {
								if (data && data.event) {
									try {
										const cur = JSON.parse(localStorage.getItem('jc_enterprise_audit_events') || '[]');
										cur.unshift(data.event);
										if (cur.length > 500) cur.length = 500;
										localStorage.setItem('jc_enterprise_audit_events', JSON.stringify(cur));
									} catch (e) {}
									window.dispatchEvent(new CustomEvent('audit_event_logged', { detail: data.event }));
								}
							}).catch(() => {});
						}
					}
				} catch (err) {}
			}

			return response;
		})
		.catch(error => {
			if (!url.match(/.html?$/i)) {
				console.error(error);
			}

			throw error;
		});
};

if (window.navigation && window.self !== window.top) {
	window.navigation.addEventListener('navigate', (event) => {
		const url = event.destination.url;

		try {
			const destinationUrl = new URL(url);
			const destinationOrigin = destinationUrl.origin;
			const currentOrigin = window.location.origin;

			if (destinationOrigin === currentOrigin) {
				return;
			}
		} catch (error) {
			return;
		}

		window.parent.postMessage({
			type: 'horizons-navigation-error',
			url,
		}, '*');
	});
}
